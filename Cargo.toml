# The Rust implementation of Mandate. mandate-ir reads, canonicalises and
# hashes IR exactly as the TypeScript compiler does, and holds what the ported
# phases of that compiler share (diagnostics, the output value and
# JSON.stringify, ECMAScript's member order and number text); verify-journal
# verifies an exported run journal independently of the runtime; and
# mandate-testkit is what their tests share (a dev-dependency only). The
# compiler is being ported on top of mandate-ir: mandate-syntax, then
# mandate-check, then mandate-views, each depending on the one before, until
# the Rust compiler gives the TypeScript one's bytes for every output in
# compiler/test/golden/outputs.json and every case in conformance/. The
# vectors in vectors/ hold the two to the same bytes. Release 0.6 adds
# mandate-lib (the model of a library: manifest, digest, version rules),
# mandate-doors (the JSON doors, one dispatcher over the compiler's
# functions), mandate-wasm (the compiler as a wasm32-wasip1 command module
# that the Node runtime calls) and mandate-cli (the native command line,
# the `mandate` binary).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Untrusted input must never panic: no unwrap, no indexing that can go out of
# bounds, no arithmetic that can overflow.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

# The tests of verify-journal check thousands of signatures and hashes; these
# two are optimised in test builds too, so that they run in seconds.
[profile.dev.package.ed25519-compact]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
