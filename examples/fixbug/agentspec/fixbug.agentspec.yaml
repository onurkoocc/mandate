      type: array
      items:
        type: string
    branches:
    - met
    - unmet
    contract:
      component_type: MandateContract
      id: contract.FixAccepted
      name: FixAccepted
      description: null
      metadata: {}
      parameters:
      - title: issue
        type: object
        properties:
          id:
            type: string
          reproducible:
            type: boolean
          scope:
            type: array
            items:
              type: string
            uniqueItems: true
        required:
        - id
        - reproducible
        - scope
      - title: pr
        type: object
      requires:
      - name: reproducible
        op: field
        of:
          name: issue
          op: var
      criteria:
      - name: regression_test
        description: A regression test fails before the fix and passes after it
        method:
          call:
            op: call
            callee:
              name: red_then_green
              op: field
              of:
                name: test
                op: var
            args:
            - value:
                name: patch
                op: field
                of:
                  name: pr
                  op: var
            - value:
                name: tests
                op: field
                of:
                  name: pr
                  op: var
      - name: scope_respected
        description: The change stays inside the task scope
        method:
          static:
            op: binary
            bop: subseteq
            left:
              name: files
              op: field
              of:
                name: patch
                op: field
                of:
                  name: pr
                  op: var
            right:
              name: scope
              op: field
              of:
                name: issue
                op: var
      - name: suite_green
        description: The existing test suite passes
        method:
          call:
            op: call
            callee:
              name: suite
              op: field
              of:
                name: test
                op: var
            args:
            - value:
                op: list
                items:
                - op: text
                  value: unit
                - op: text
                  value: integration
      - name: no_blocking_review
        description: Independent review found no blocking issue
        method:
          all:
          - static:
              op: unary
              uop: not
              of:
                name: blocking
                op: field
                of:
                  name: review
                  op: field
                  of:
                    name: pr
                    op: var
          - call:
              op: call
              callee:
                name: review
                op: var
              args:
              - value:
                  name: isolated
                  op: var
              - name: model
                value:
                  name: standard
                  op: var
      - name: owner_approved
        description: The code owner approved
        method:
          call:
            op: call
            callee:
              name: approve
              op: field
              of:
                name: human
                op: var
            args:
            - name: role
              value:
                op: text
                value: code_owner
      component_plugin_name: MandateAgentSpecExtension
      component_plugin_version: 0.1.0
    args:
    - name: issue
      op: var
    - name: draft
      op: var
    value:
      name: draft
      op: var
    component_plugin_name: MandateAgentSpecExtension
    component_plugin_version: 0.1.0
