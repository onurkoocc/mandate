# The job runner of scripts/docker-ci.sh and the services the jobs of .github/workflows/ci.yml use (a PostgreSQL server
# and an OpenTelemetry Collector, by the same digests as ci.yml). Always run through the script, which passes
# --project-directory docker and --env-file docker/empty.env, so that no dotenv file is read (docker/README.md, "The
# secret boundary"). This file has no bind mount, no environment entry without a value, no variable interpolation (no
# dollar sign at all), no published port and nothing privileged; docker/check.mjs checks the file and its resolved
# model against an allowlist and fails on anything else.
name: mandate-ci

x-runner: &runner
  # The build context is this directory (docker/): nothing else of the host reaches the image.
  image: mandate-ci-runner:local
  pull_policy: never
  init: true
  # No environment and no env_file: no variable of the host is passed through. The script gives each run the few values
  # it needs with -e NAME=value on the command line, every one of them written in the script itself. The commit under
  # test arrives on the standard input of the container as an archive; no host directory is mounted.
  volumes:
    - cargo-home:/cache/cargo
    - npm-cache:/cache/npm
    - otel-config:/otel/config
    - otel-out:/otel/out

services:
  runner:
    <<: *runner
    build:
      context: .
      dockerfile: Dockerfile
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: [run]

  # The sandbox job only: Bubblewrap needs user namespaces, which the default seccomp profile of a container refuses,
  # and slirp4netns (the proxy-only egress of the sandbox) opens /dev/net/tun. Nothing else is granted: no capability
  # is added, the container is not privileged, has no Docker socket and is not on the host network.
  runner-sandbox:
    <<: *runner
    cap_drop: [ALL]
    security_opt: ["seccomp=unconfined", "no-new-privileges:true"]
    devices: ["/dev/net/tun:/dev/net/tun"]
    profiles: [run]

  # As in ci.yml's test job; the server is reached on the private network of the project, with trust authentication
  # (no password anywhere), and its port is not published. Its data is in memory: every run starts from nothing.
  postgres:
    image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_USER: mandate
      POSTGRES_DB: mandate_test
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: [services]

  # As in ci.yml's test job: the core distribution of the collector. Its configuration is the one of the commit under
  # test (runtime/test/otel-collector.yaml), put in the otel-config volume by the script before the collector starts;
  # what it writes is in the otel-out volume, which the runner mounts too. It runs as the runner's uid (1000), so that
  # the file it writes is one the test can read, as in ci.yml.
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.165.0@sha256:34b24b740c3c88d3467740e8642a397c13898ef76d7295c5425164c482ed1b73
    user: "1000:1000"
    volumes:
      - otel-config:/etc/otelcol:ro
      - otel-out:/out
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    profiles: [services]

volumes:
  # The cargo registry and git caches (CARGO_HOME), shared by the jobs: downloads only, never build output.
  cargo-home:
  # The npm download cache.
  npm-cache:
  otel-config:
  otel-out:
