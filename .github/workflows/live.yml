name: live

# Live model and GitHub calls (BACKLOG K15): run only by hand, never on a pull
# request, because they spend money and touch the test repository. Needs the
# repository secrets CLAUDE_API_KEY, CLAUDE_WORKSPACE_ID (for a key not scoped
# to a workspace) and MANDATE_GITHUB_TOKEN (the fine-grained token for
# onurkoocc/mandate-fixbug-target only, K18).
#
# Two more live tests run only when their input is set, each in a step of its
# own with only the model's secrets: the Managed Agents trial
# (test/live-managed-agents.test.ts, MANDATE_MA=1; a 2 USD run) and the
# migration example with a real model as its lead (test/demo.test.ts,
# MANDATE_ENVELOPE=1; the lead may spend up to 10 USD).
#
#   gh workflow run live.yml
#   gh workflow run live.yml -f managed_agents=true -f envelope=true

on:
  workflow_dispatch:
    inputs:
      managed_agents:
        description: "Also run the Managed Agents trial (test/live-managed-agents.test.ts, MANDATE_MA=1)"
        type: boolean
        default: false
      envelope:
        description: "Also run the migration example with a real lead (test/demo.test.ts, MANDATE_ENVELOPE=1)"
        type: boolean
        default: false

# The live tests reach GitHub with MANDATE_GITHUB_TOKEN, not with this
# workflow's own token, so that token only needs to read the repository.
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      # A secret that is not set reaches a step as an empty text, and each test then fails for a reason that does not
      # name the secret. This step looks at the secrets only to see whether they are set, and prints none: without
      # the model's key it fails before anything is installed; without the GitHub token it says which test is skipped.
      - name: The secrets the live tests need are set
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          MANDATE_GITHUB_TOKEN: ${{ secrets.MANDATE_GITHUB_TOKEN }}
        run: |
          if [ -z "$MANDATE_GITHUB_TOKEN" ]; then
            echo "::notice::the repository secret MANDATE_GITHUB_TOKEN is not set: the test that opens a pull request on the test repository is skipped"
          fi
          if [ -z "$CLAUDE_API_KEY" ]; then
            echo "::error::the repository secret CLAUDE_API_KEY is not set, and every live test calls the model with it. Set it with: gh secret set CLAUDE_API_KEY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Live tests (MANDATE_LIVE=1)
        working-directory: runtime
        env:
          MANDATE_LIVE: "1"
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_WORKSPACE_ID: ${{ secrets.CLAUDE_WORKSPACE_ID }}
          MANDATE_GITHUB_TOKEN: ${{ secrets.MANDATE_GITHUB_TOKEN }}
        run: npx vitest run test/live.test.ts
      - name: The Managed Agents trial (MANDATE_MA=1)
        if: ${{ !cancelled() && inputs.managed_agents }}
        working-directory: runtime
        env:
          MANDATE_LIVE: "1"
          MANDATE_MA: "1"
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_WORKSPACE_ID: ${{ secrets.CLAUDE_WORKSPACE_ID }}
        run: npx vitest run test/live-managed-agents.test.ts
      - name: The migration example with a real model as its lead (MANDATE_ENVELOPE=1)
        if: ${{ !cancelled() && inputs.envelope }}
        working-directory: runtime
        env:
          MANDATE_LIVE: "1"
          MANDATE_ENVELOPE: "1"
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_WORKSPACE_ID: ${{ secrets.CLAUDE_WORKSPACE_ID }}
        run: npx vitest run test/demo.test.ts
