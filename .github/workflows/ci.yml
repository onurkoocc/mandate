name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Runtime tests on PostgreSQL
        run: npm test -w runtime
        env:
          MANDATE_TEST_DATABASE_URL: postgresql://mandate:mandate@localhost:5432/mandate_test
      - name: Check the FixBug example
        run: |
          node compiler/dist/cli.js check examples/fixbug/fixbug.mdt
          node compiler/dist/cli.js check examples/fixbug/fixbug.ir.json
          node compiler/dist/cli.js sandbox examples/fixbug/fixbug.ir.json > /dev/null

  agentspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/fixbug/agentspec/requirements*.txt
      - run: pip install -r examples/fixbug/agentspec/requirements.txt
      - name: Validate FixBug in Agent Spec
        run: python examples/fixbug/agentspec/check.py
      - name: Probe the extensions on WayFlow
        run: python examples/fixbug/agentspec/probe.py wayflow
      - name: Probe the extensions on LangGraph
        run: |
          python -m venv /tmp/langgraph
          /tmp/langgraph/bin/pip install -r examples/fixbug/agentspec/requirements-langgraph.txt
          /tmp/langgraph/bin/python examples/fixbug/agentspec/probe.py langgraph

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci
      - name: Sandbox enforcement on Bubblewrap (G05, G07)
        working-directory: runtime
        env:
          MANDATE_MXC: "1"
        run: npx vitest run test/mxc.test.ts
