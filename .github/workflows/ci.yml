name: ci

on:
  push:
    branches: [main, "claude/boundary-r*"]
  pull_request:

# What runs when. A pull request and a push to main run every job. A push to a
# claude/boundary-r* branch, the slices of the Rust port, runs only the rust
# job: a slice is brought to green on its branch before its pull request is
# opened, and the jobs that are slow and need PostgreSQL or a real sandbox
# (test, sandbox, sandbox-windows) are left to the pull request.
# A branch with an open pull request is pushed to twice over, as a push and as
# a pull request, so its rust job runs twice.
#
# Every job reads the repository and nothing else. Actions are pinned to full
# commit SHAs (the tag is in the comment) so a moved tag cannot change what
# runs; Renovate keeps the pins current. Installs run no lifecycle scripts:
# none of the packages with an install script is needed by these jobs.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Runtime tests on PostgreSQL
        run: npm test -w runtime
        env:
          MANDATE_TEST_DATABASE_URL: postgresql://mandate:mandate@localhost:5432/mandate_test
      - name: Check the FixBug fixture with the CLI
        run: |
          node compiler/dist/cli.js check fixtures/fixbug/fixbug.mdt
          node compiler/dist/cli.js check fixtures/fixbug/fixbug.ir.json
          node compiler/dist/cli.js sandbox fixtures/fixbug/fixbug.ir.json > /dev/null
          node compiler/dist/cli.js test fixtures/fixbug/fixbug.mdt
      # A real OPA for the generated Rego (compiler/test/acs.test.ts, X05). The binary is the static Linux build of one
      # release, from the project's GitHub releases; its sha256 is the one the release publishes next to it
      # (opa_linux_amd64_static.sha256), fixed here and checked before the binary is run. 1.4.2 is the version the test
      # names for the Docker image, so the two ways of running it are the same OPA.
      - name: Install OPA 1.4.2 (static Linux binary, sha256 checked)
        env:
          OPA_VERSION: "1.4.2"
          OPA_SHA256: 2c0ccdbbe0b8e2a5d12d9c42d92f1f34f494ffb32d1f3c4ddc36101be637d66f
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opa" "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "$OPA_SHA256  $RUNNER_TEMP/opa" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opa"
          "$RUNNER_TEMP/opa" version
      # npm test above skipped the gated part of this file. Here MANDATE_OPA names the binary, the reporter lists each
      # test, and assert-ran.mjs fails the step if any test of the file was skipped, so a green step means the generated
      # Rego was evaluated by the real OPA.
      - name: The generated Rego on a real OPA (X05), run and not skipped
        working-directory: compiler
        env:
          MANDATE_OPA: ${{ runner.temp }}/opa
          VITEST_REPORT: ${{ runner.temp }}/acs-report.json
        run: |
          npx vitest run test/acs.test.ts --reporter=verbose --reporter=json --outputFile.json="$VITEST_REPORT"
          node ../scripts/assert-ran.mjs "$VITEST_REPORT" "the generated Rego on a real OPA"

  sandbox:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install Bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          # slirp4netns and iptables: Bubblewrap's proxy-only egress mode (MXC checks for them).
          sudo apt-get install -y -qq bubblewrap slirp4netns iptables iproute2 util-linux
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci --ignore-scripts
      - name: Make /work writable for the Gate 3 rehearsal
        run: sudo mkdir -p /work && sudo chown "$(id -u):$(id -g)" /work
      - name: Sandbox enforcement on Bubblewrap (G05, G07), sandbox egress through the proxy (G15, G16), the acceptance of 0.5 in a real sandbox, the Gate 3 rehearsal, and two components in two sandboxes (B3)
        working-directory: runtime
        env:
          MANDATE_MXC: "1"
          # The acceptance test leaves its exports here, for the Rust verifier below.
          MANDATE_ACCEPTANCE_OUT: ${{ runner.temp }}/acceptance
        run: npx vitest run test/mxc.test.ts test/sandbox-egress.test.ts test/boundary-acceptance.test.ts test/gate3.test.ts test/workspace.test.ts
      # The container sandbox host on the runner's own Docker engine (G05, G07): runtime/test/container.test.ts runs its
      # second part only with MANDATE_CONTAINER=1. The images it runs in are named there by digest. assert-ran.mjs fails
      # the step if any test of the file was skipped.
      - name: The container sandbox host on a real Docker engine (G05, G07), run and not skipped
        working-directory: runtime
        env:
          MANDATE_CONTAINER: "1"
          VITEST_REPORT: ${{ runner.temp }}/container-report.json
        run: |
          docker version --format 'engine {{.Server.Os}} {{.Server.Version}}'
          npx vitest run test/container.test.ts --reporter=verbose --reporter=json --outputFile.json="$VITEST_REPORT"
          node ../scripts/assert-ran.mjs "$VITEST_REPORT" "the container sandbox host on a real Docker engine"
      # The independent verifier on what the run in the real sandbox left: its journal's export must verify, and the
      # export made after one event was changed in the database must be chain_broken at that event.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build verify-journal
        run: cargo build --locked -p verify-journal
      - name: verify-journal verifies the export of the run in the real sandbox, and finds the event changed in the next
        env:
          ACCEPTANCE: ${{ runner.temp }}/acceptance
        run: |
          for f in run.json tampered.json cp.pub.pem tampered-seq; do
            if [ ! -s "$ACCEPTANCE/$f" ]; then echo "::error::the acceptance test left no $f"; exit 1; fi
          done
          verify() { cargo run --locked --quiet -p verify-journal -- "$@"; }

          code=0
          verify "$ACCEPTANCE/run.json" --key "$ACCEPTANCE/cp.pub.pem" > "$ACCEPTANCE/rust-report.json" || code=$?
          cat "$ACCEPTANCE/rust-report.json"
          if [ "$code" -ne 0 ]; then echo "::error::the export of the run: exit $code, not 0"; exit 1; fi
          grep -q '^  "status": "verified",$' "$ACCEPTANCE/rust-report.json"

          code=0
          verify "$ACCEPTANCE/tampered.json" --key "$ACCEPTANCE/cp.pub.pem" > "$ACCEPTANCE/rust-tampered.json" || code=$?
          cat "$ACCEPTANCE/rust-tampered.json"
          if [ "$code" -ne 1 ]; then echo "::error::the export with one event changed: exit $code, not 1"; exit 1; fi
          seq="$(cat "$ACCEPTANCE/tampered-seq")"
          grep -A1 '"code": "chain_broken",' "$ACCEPTANCE/rust-tampered.json" | grep -q "\"seq\": $seq\$"

  sandbox-windows:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sandbox enforcement in an AppContainer (G05, G07; P2-27)
        working-directory: runtime
        env:
          MANDATE_MXC: "1"
        run: npx vitest run test/mxc-windows.test.ts test/workspace.test.ts

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is on the runner; with no argument it installs the toolchain
      # rust-toolchain.toml pins, with rustfmt and clippy.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # --nocapture so that the log shows how many conformance cases the crates ran and skipped.
      - name: Rust tests, against the vectors the TypeScript compiler writes and the conformance cases
        run: cargo test --locked -- --nocapture
      # mandate-ir for WebAssembly: it is kept buildable for wasm32-wasip1 (release
      # 0.6 may call the Rust compiler that way), and its tests run there under Node's
      # WASI, the way a developer machine that cannot run a native test runs them
      # (scripts/wasi-test.mjs says what that cannot run). Node first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Build mandate-ir for WebAssembly
        run: cargo build --locked --target wasm32-wasip1 -p mandate-ir
      - name: mandate-ir tests under Node's WASI
        run: node scripts/wasi-test.mjs -p mandate-ir -- --nocapture
      # The Rust verifier against the TypeScript runtime on a run made now: a
      # fresh export of a real run (PGlite, in process) must be verified, and
      # the same export with one event changed must be chain_broken at that
      # event, each with the report the TypeScript verifier gives, byte for byte.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Build verify-journal
        run: cargo build --locked -p verify-journal
      - name: verify-journal verifies a fresh export of a real run, and finds one event changed
        run: |
          fresh="$RUNNER_TEMP/fresh"
          node runtime/scripts/journal-fresh.mjs "$fresh"
          verify() { cargo run --locked --quiet -p verify-journal -- "$@"; }

          code=0
          verify "$fresh/export.json" --key "$fresh/key.pem" > "$fresh/rust-report.json" || code=$?
          cat "$fresh/rust-report.json"
          if [ "$code" -ne 0 ]; then echo "::error::the fresh export: exit $code, not 0"; exit 1; fi
          grep -q '^  "status": "verified",$' "$fresh/rust-report.json"
          cmp "$fresh/report.json" "$fresh/rust-report.json"

          code=0
          verify "$fresh/tampered.json" --key "$fresh/key.pem" > "$fresh/rust-tampered.json" || code=$?
          cat "$fresh/rust-tampered.json"
          if [ "$code" -ne 1 ]; then echo "::error::the tampered export: exit $code, not 1"; exit 1; fi
          seq="$(cat "$fresh/tampered-seq")"
          grep -A1 '"code": "chain_broken",' "$fresh/rust-tampered.json" | grep -q "\"seq\": $seq\$"
          cmp "$fresh/tampered-report.json" "$fresh/rust-tampered.json"
