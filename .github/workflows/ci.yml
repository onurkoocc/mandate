name: ci

on:
  push:
    branches: [main, "claude/library-r*"]
  pull_request:

# What runs when. A pull request and a push to main run every job. A push to a
# claude/library-r* branch, the slices of a release, runs only the rust and
# parity jobs, without a pull request: a slice is brought to green on its
# branch before its pull request is opened, and the jobs that are slow and need
# PostgreSQL or a real sandbox (test, sandbox, sandbox-windows) are left to the
# pull request.
# A branch with an open pull request is pushed to twice over, as a push and as
# a pull request, so those two jobs run twice.
#
# Every job reads the repository and nothing else. Actions are pinned to full
# commit SHAs (the tag is in the comment) so a moved tag cannot change what
# runs; the pins are updated by hand, with the tag in the comment. Installs run no lifecycle scripts:
# none of the packages with an install script is needed by these jobs.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The compiled corpus (vectors/corpus/) is complete: the suite runs again with every call it makes to a front door
      # of the compiler recorded, and corpus.test.ts fails if that is not exactly what the corpus holds, so a new test
      # that calls a door cannot leave the corpus incomplete (vectors/README.md, "corpus/", "How it is made").
      - name: The compiled corpus holds every call the compiler's tests make to a front door
        run: npm test -w compiler
        env:
          MANDATE_CORPUS: "1"
      - name: Runtime tests on PostgreSQL
        run: npm test -w runtime
        env:
          MANDATE_TEST_DATABASE_URL: postgresql://mandate:mandate@localhost:5432/mandate_test
      - name: Check the FixBug fixture with the CLI
        run: |
          node compiler/dist/cli.js check fixtures/fixbug/fixbug.mdt
          node compiler/dist/cli.js check fixtures/fixbug/fixbug.ir.json
          node compiler/dist/cli.js sandbox fixtures/fixbug/fixbug.ir.json > /dev/null
          node compiler/dist/cli.js test fixtures/fixbug/fixbug.mdt
      # A real OPA for the generated Rego (compiler/test/acs.test.ts, X05). The binary is the static Linux build of one
      # release, from the project's GitHub releases; its sha256 is the one the release publishes next to it
      # (opa_linux_amd64_static.sha256), fixed here and checked before the binary is run. 1.4.2 is the version the test
      # names for the Docker image, so the two ways of running it are the same OPA.
      - name: Install OPA 1.4.2 (static Linux binary, sha256 checked)
        env:
          OPA_VERSION: "1.4.2"
          OPA_SHA256: 2c0ccdbbe0b8e2a5d12d9c42d92f1f34f494ffb32d1f3c4ddc36101be637d66f
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opa" "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "$OPA_SHA256  $RUNNER_TEMP/opa" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opa"
          "$RUNNER_TEMP/opa" version
      # npm test above skipped the gated part of this file. Here MANDATE_OPA names the binary, the reporter lists each
      # test, and assert-ran.mjs fails the step if any test of the file was skipped, so a green step means the generated
      # Rego was evaluated by the real OPA.
      - name: The generated Rego on a real OPA (X05), run and not skipped
        working-directory: compiler
        env:
          MANDATE_OPA: ${{ runner.temp }}/opa
          VITEST_REPORT: ${{ runner.temp }}/acs-report.json
        run: |
          npx vitest run test/acs.test.ts --reporter=verbose --reporter=json --outputFile.json="$VITEST_REPORT"
          node ../scripts/assert-ran.mjs "$VITEST_REPORT" "the generated Rego on a real OPA"
      # A real OpenTelemetry Collector for `mandate otel export` (runtime/test/otel-collector.test.ts). The image is the
      # collector's core distribution, whose manifest lists the `file` exporter, pinned by the digest of its manifest
      # list (the same on ghcr.io and Docker Hub). It runs as the runner's own user, so that the file it writes to the
      # mounted directory can be read by the test, and its port is published on the loopback address only. Its
      # configuration is in the repository: it takes OTLP over HTTP and writes each request as a line of JSON.
      - name: Start an OpenTelemetry Collector 0.165.0 (core distribution, image pinned by digest)
        env:
          COLLECTOR_IMAGE: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.165.0@sha256:34b24b740c3c88d3467740e8642a397c13898ef76d7295c5425164c482ed1b73
        run: |
          mkdir -p "$RUNNER_TEMP/otel-out"
          docker run -d --name otel-collector --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:4318:4318 \
            -v "$PWD/runtime/test/otel-collector.yaml:/etc/otelcol/config.yaml:ro" \
            -v "$RUNNER_TEMP/otel-out:/out" \
            "$COLLECTOR_IMAGE"
          # Ready when the receiver answers at all (a GET of the traces path is answered 405): not when the container is up.
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Running}}' otel-collector)" != "true" ]; then
              echo "::error::the collector container stopped before it was ready"
              docker logs otel-collector
              exit 1
            fi
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4318/v1/traces || true)"
            if [ "$code" != "000" ]; then echo "the collector's receiver answered $code after $i s"; exit 0; fi
            sleep 1
          done
          echo "::error::the collector's receiver did not answer within 60 s"
          docker logs otel-collector
          exit 1
      # The export is sent to that collector and what the collector wrote is compared with the run's journal. The
      # reporter lists the test and assert-ran.mjs fails the step if it was skipped.
      - name: mandate otel export against the real OpenTelemetry Collector, run and not skipped
        working-directory: runtime
        env:
          MANDATE_OTEL_COLLECTOR: http://127.0.0.1:4318
          MANDATE_OTEL_COLLECTOR_OUT: ${{ runner.temp }}/otel-out/spans.json
          VITEST_REPORT: ${{ runner.temp }}/otel-collector-report.json
        run: |
          npx vitest run test/otel-collector.test.ts --reporter=verbose --reporter=json --outputFile.json="$VITEST_REPORT"
          node ../scripts/assert-ran.mjs "$VITEST_REPORT" "mandate otel export against a real OpenTelemetry Collector"
      - name: The collector's log and file (shown when the step above failed)
        if: failure()
        run: |
          echo "--- docker logs otel-collector"
          docker logs otel-collector || true
          echo "--- $RUNNER_TEMP/otel-out"
          ls -l "$RUNNER_TEMP/otel-out" || true
          echo "--- first 4000 bytes of spans.json"
          head -c 4000 "$RUNNER_TEMP/otel-out/spans.json" || true
      - name: Stop the OpenTelemetry Collector
        if: always()
        run: docker rm -f otel-collector

  # On two Ubuntu releases, so that what is enforced (the sandbox, and its egress through the proxy alone) is shown on a
  # second kernel and a second Bubblewrap and slirp4netns. A failure of one release does not stop the other.
  sandbox:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install Bubblewrap and allow unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          # slirp4netns and iptables: Bubblewrap's proxy-only egress mode (MXC checks for them).
          sudo apt-get install -y -qq bubblewrap slirp4netns iptables iproute2 util-linux
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
      - run: npm ci --ignore-scripts
      - name: Make /work writable for the Gate 3 rehearsal
        run: sudo mkdir -p /work && sudo chown "$(id -u):$(id -g)" /work
      - name: Sandbox enforcement on Bubblewrap (G05, G07), sandbox egress through the proxy (G15, G16), the acceptance of 0.5 in a real sandbox, the Gate 3 rehearsal, and two components in two sandboxes (B3)
        working-directory: runtime
        env:
          MANDATE_MXC: "1"
          # The acceptance test leaves its exports here, for the Rust verifier below.
          MANDATE_ACCEPTANCE_OUT: ${{ runner.temp }}/acceptance
        run: npx vitest run test/mxc.test.ts test/sandbox-egress.test.ts test/boundary-acceptance.test.ts test/gate3.test.ts test/workspace.test.ts
      # The container sandbox host on the runner's own Docker engine (G05, G07): runtime/test/container.test.ts runs its
      # second part only with MANDATE_CONTAINER=1. The images it runs in are named there by digest. assert-ran.mjs fails
      # the step if any test of the file was skipped.
      - name: The container sandbox host on a real Docker engine (G05, G07), run and not skipped
        working-directory: runtime
        env:
          MANDATE_CONTAINER: "1"
          VITEST_REPORT: ${{ runner.temp }}/container-report.json
        run: |
          docker version --format 'engine {{.Server.Os}} {{.Server.Version}}'
          npx vitest run test/container.test.ts --reporter=verbose --reporter=json --outputFile.json="$VITEST_REPORT"
          node ../scripts/assert-ran.mjs "$VITEST_REPORT" "the container sandbox host on a real Docker engine"
      # The independent verifier on what the run in the real sandbox left: its journal's export must verify, and the
      # export made after one event was changed in the database must be chain_broken at that event.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build verify-journal
        run: cargo build --locked -p verify-journal
      - name: verify-journal verifies the export of the run in the real sandbox, and finds the event changed in the next
        env:
          ACCEPTANCE: ${{ runner.temp }}/acceptance
        run: |
          for f in run.json tampered.json cp.pub.pem tampered-seq; do
            if [ ! -s "$ACCEPTANCE/$f" ]; then echo "::error::the acceptance test left no $f"; exit 1; fi
          done
          verify() { cargo run --locked --quiet -p verify-journal -- "$@"; }

          code=0
          verify "$ACCEPTANCE/run.json" --key "$ACCEPTANCE/cp.pub.pem" > "$ACCEPTANCE/rust-report.json" || code=$?
          cat "$ACCEPTANCE/rust-report.json"
          if [ "$code" -ne 0 ]; then echo "::error::the export of the run: exit $code, not 0"; exit 1; fi
          grep -q '^  "status": "verified",$' "$ACCEPTANCE/rust-report.json"

          code=0
          verify "$ACCEPTANCE/tampered.json" --key "$ACCEPTANCE/cp.pub.pem" > "$ACCEPTANCE/rust-tampered.json" || code=$?
          cat "$ACCEPTANCE/rust-tampered.json"
          if [ "$code" -ne 1 ]; then echo "::error::the export with one event changed: exit $code, not 1"; exit 1; fi
          seq="$(cat "$ACCEPTANCE/tampered-seq")"
          grep -A1 '"code": "chain_broken",' "$ACCEPTANCE/rust-tampered.json" | grep -q "\"seq\": $seq\$"

  sandbox-windows:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sandbox enforcement in an AppContainer (G05, G07; P2-27)
        working-directory: runtime
        env:
          MANDATE_MXC: "1"
        run: npx vitest run test/mxc-windows.test.ts test/workspace.test.ts
      # Tests with a branch that runs only on Windows: another drive and a UNC path refused, a junction where a link is
      # made, `docker` found as an .exe, the egress proxy's admin channel as a named pipe, and no SIGTERM to catch.
      - name: The Windows branches of the path, environment and egress tests
        working-directory: runtime
        run: npx vitest run test/paths.test.ts test/child-env.test.ts test/egress-cli.test.ts

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is on the runner; with no argument it installs the toolchain
      # rust-toolchain.toml pins, with rustfmt and clippy.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # --nocapture so that the log shows how many conformance cases the crates ran and skipped.
      - name: Rust tests, against the vectors the TypeScript compiler writes and the conformance cases
        run: cargo test --locked -- --nocapture
      # Node and its build come first: the freshness step below runs the vector scripts, which read the built
      # TypeScript compiler, and verify-journal is tried against a run the built runtime makes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The Rust verifier against the TypeScript runtime on a run made now: a
      # fresh export of a real run (PGlite, in process) must be verified, and
      # the same export with one event changed must be chain_broken at that
      # event, each with the report the TypeScript verifier gives, byte for byte.
      - name: Build verify-journal
        run: cargo build --locked -p verify-journal
      - name: verify-journal verifies a fresh export of a real run, and finds one event changed
        run: |
          fresh="$RUNNER_TEMP/fresh"
          node runtime/scripts/journal-fresh.mjs "$fresh"
          verify() { cargo run --locked --quiet -p verify-journal -- "$@"; }

          code=0
          verify "$fresh/export.json" --key "$fresh/key.pem" > "$fresh/rust-report.json" || code=$?
          cat "$fresh/rust-report.json"
          if [ "$code" -ne 0 ]; then echo "::error::the fresh export: exit $code, not 0"; exit 1; fi
          grep -q '^  "status": "verified",$' "$fresh/rust-report.json"
          cmp "$fresh/report.json" "$fresh/rust-report.json"

          code=0
          verify "$fresh/tampered.json" --key "$fresh/key.pem" > "$fresh/rust-tampered.json" || code=$?
          cat "$fresh/rust-tampered.json"
          if [ "$code" -ne 1 ]; then echo "::error::the tampered export: exit $code, not 1"; exit 1; fi
          seq="$(cat "$fresh/tampered-seq")"
          grep -A1 '"code": "chain_broken",' "$fresh/rust-tampered.json" | grep -q "\"seq\": $seq\$"
          cmp "$fresh/tampered-report.json" "$fresh/rust-tampered.json"
      # The test data of the Rust crates is written by the scripts/*-vectors.mjs scripts from the TypeScript compiler
      # built above, and what each writes must be what is committed. Every script is run, and after each one the
      # working tree must be as committed: a modified or an untracked file is an error that names the script. The
      # scripts that read only the committed inputs.json write the expected.json beside it, as the TypeScript gives
      # it: caps-vectors (capabilities, the std tables, governance-class files, paths), front-vectors (link,
      # resolveNames, the role checks and check), lock-vectors (the lock, the executor binding checks and the sandbox
      # requirements), views-vectors (the comparison of two programs, patches, Number(text) and the documents, as
      # digests of their texts), static-vectors (the static checks, the types and the cost model) and doors-vectors
      # (the system model's checks, checkPatch, checkSubprogram, checkAmendment and subprogramLinked). A new
      # scripts/NAME-vectors.mjs is picked up without a change here.
      - name: The test data of the Rust crates is what the TypeScript compiler gives now
        run: |
          for script in scripts/*-vectors.mjs; do
            echo "--- $script"
            node "$script"
            changed="$(git status --porcelain)"
            if [ -n "$changed" ]; then
              echo "::error::$script changed or wrote files that are not committed:"
              echo "$changed"
              git diff
              exit 1
            fi
          done
      # mandate-ir, mandate-syntax and the other library crates for WebAssembly: they are kept buildable for
      # wasm32-wasip1, which is what release 0.6 calls the Rust compiler as. The crates are the directories of
      # crates/ (the package name is the name in each Cargo.toml), so that a new crate is built here and tested
      # below without a change to this file.
      - name: Build the crates for WebAssembly
        run: |
          packages=""
          for manifest in crates/*/Cargo.toml; do
            crate="$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -n 1)"
            if [ -z "$crate" ]; then echo "::error::$manifest has no package name"; exit 1; fi
            case "$crate" in
              verify-journal | mandate-cli) ;;
              *) packages="$packages -p $crate" ;;
            esac
          done
          echo "building:$packages"
          cargo build --locked --target wasm32-wasip1 $packages
      # The tests of every crate under Node's WASI, the way a developer machine that cannot run a native test runs
      # them (scripts/wasi-test.mjs says what that cannot run). Every crate of crates/ is run, except verify-journal
      # and mandate-cli: their tests start processes or read files outside the repository, which WASI preview 1
      # cannot do (they run natively above). A crate with no test still builds its test executable, which runs 0
      # tests and exits 0; a crate that built none, or whose executable trapped or exited non-zero, fails the
      # driver, and so this step, which names the crate and goes on to the next so that one run shows every failure.
      # The log shows how many conformance cases the crates ran, how many inputs of vectors/syntax.json the parser
      # reads as TypeScript does, and how many pinned outputs the Rust compiler gives and how many are still pending.
      - name: Tests of the crates under Node's WASI
        run: |
          failed=""
          for manifest in crates/*/Cargo.toml; do
            crate="$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -n 1)"
            if [ -z "$crate" ]; then echo "::error::$manifest has no package name"; exit 1; fi
            case "$crate" in
              verify-journal | mandate-cli)
                echo "--- $crate: not run under WASI (it starts processes or reads files)"
                continue
                ;;
            esac
            echo "::group::$crate under Node's WASI"
            if ! node scripts/wasi-test.mjs -p "$crate" -- --nocapture; then
              echo "::endgroup::"
              echo "::error::the tests of $crate failed under Node's WASI"
              failed="$failed $crate"
            else
              echo "::endgroup::"
            fi
          done
          if [ -n "$failed" ]; then echo "::error::failed under Node's WASI:$failed"; exit 1; fi
      # The module the Node runtime will call: the compiler as a WebAssembly command, with a ceiling on its memory
      # (256 MiB), a 4 MiB stack, and the stack placed first so that an overflow traps instead of overwriting data.
      - name: Build the WebAssembly module of the compiler (mandate-wasm)
        run: |
          cargo rustc --locked -p mandate-wasm --release --target wasm32-wasip1 --bin mandate-wasm -- \
            -C link-arg=--max-memory=268435456 -C link-arg=-zstack-size=4194304 -C link-arg=--stack-first
          ls -l target/wasm32-wasip1/release/mandate-wasm.wasm

  # The golden gate of the rust job compares digests, and a digest that differs says nothing about what differs. This
  # job writes the output texts of both compilers into two directories, in the layout vectors/README.md names ("The
  # golden output texts": <program path>/<output name, spaces as _>), and compares them with diff -ru: any difference
  # fails it and is shown. Both directories must hold exactly as many files as the golden file pins outputs, so that
  # a side which wrote less cannot pass by leaving out what would differ.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: The TypeScript compiler writes its output texts
        working-directory: compiler
        env:
          MANDATE_GOLDEN_OUT: ${{ runner.temp }}/parity/ts
        run: npx vitest run test/golden.test.ts
      - name: The Rust compiler writes its output texts
        env:
          MANDATE_GOLDEN_OUT: ${{ runner.temp }}/parity/rust
        run: cargo test --locked -p mandate-testkit --test golden -- --nocapture
      - name: The two directories hold the same files and the same bytes
        env:
          PARITY: ${{ runner.temp }}/parity
        run: |
          want="$(node -e 'const g = JSON.parse(require("fs").readFileSync("compiler/test/golden/outputs.json", "utf8")); console.log(Object.values(g).reduce((n, row) => n + Object.keys(row).length, 0))')"
          echo "the golden file pins $want outputs"
          # The outputs of 0.1 to 0.5 are 231: the golden file may grow, and may not shrink.
          if [ "$want" -lt 231 ]; then echo "::error::the golden file pins $want outputs, fewer than the 231 of releases 0.1 to 0.5: an output was removed"; exit 1; fi
          for side in ts rust; do
            have="$(find "$PARITY/$side" -type f | wc -l)"
            echo "$side: $have files"
            if [ "$have" -ne "$want" ]; then echo "::error::$side wrote $have files, not $want"; exit 1; fi
          done
          diff -ru "$PARITY/ts" "$PARITY/rust"
          echo "the $want output texts are the same"
