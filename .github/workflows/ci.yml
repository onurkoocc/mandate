name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Runtime tests on PostgreSQL
        run: npm test -w runtime
        env:
          MANDATE_TEST_DATABASE_URL: postgresql://mandate:mandate@localhost:5432/mandate_test
      - name: Check the FixBug example
        run: |
          node compiler/dist/cli.js check examples/fixbug/fixbug.mdt
          node compiler/dist/cli.js check examples/fixbug/fixbug.ir.json
          node compiler/dist/cli.js sandbox examples/fixbug/fixbug.ir.json > /dev/null

  agentspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/fixbug/agentspec/requirements.txt
      - run: pip install -r examples/fixbug/agentspec/requirements.txt
      - name: Validate FixBug in Agent Spec
        run: python examples/fixbug/agentspec/check.py
      - name: Probe the extensions on WayFlow and LangGraph
        run: |
          python examples/fixbug/agentspec/probe.py wayflow
          python examples/fixbug/agentspec/probe.py langgraph
