[package]
name = "mandate-check"
description = "The checks of the Rust Mandate compiler, giving the same diagnostics as the TypeScript compiler: the front doors (check, check_patch, check_subprogram, check_amendment), modules, name resolution, roles, capabilities, the static checks, the lock, the Managed Agents binding, the sandbox requirements, the comparison of two programs and structural patches"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mandate-ir = { path = "../mandate-ir" }
mandate-syntax = { path = "../mandate-syntax" }
mandate-lib = { path = "../mandate-lib" }

[dev-dependencies]
mandate-testkit = { path = "../mandate-testkit" }

[lints]
workspace = true
