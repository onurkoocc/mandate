[package]
name = "verify-journal"
description = "Verifies an exported Mandate run journal from the file and public keys alone, as spec/journal.md specifies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mandate-ir = { path = "../mandate-ir" }
sha2 = { version = "=0.11.1", default-features = false }
# Pure Rust, no dependencies and no build script with its default features
# off; its `PublicKey::verify` is RFC 8032 §5.1.7 with the cofactored
# equation, refuses S >= L, and also refuses non-canonical and small-order
# encodings of R and A, which spec/journal.md allows.
ed25519-compact = { version = "=2.6.0", default-features = false }

[dev-dependencies]
mandate-testkit = { path = "../mandate-testkit" }

[lints]
workspace = true
