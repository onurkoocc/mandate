[package]
name = "mandate-testkit"
description = "What the tests of the Rust Mandate crates share, and the gates that hold the Rust compiler to the TypeScript's stored results: the repository and its vectors, the golden digests, the compiled corpus, the table of diagnostic codes and the pending-list rule"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
mandate-ir = { path = "../mandate-ir" }
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
mandate-check = { path = "../mandate-check" }
mandate-syntax = { path = "../mandate-syntax" }
mandate-views = { path = "../mandate-views" }

[lints]
workspace = true
